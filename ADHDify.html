<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ADHDify</title>

  <!-- face-api.js -->
  <script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
  <!-- interact.js -->
  <script src="https://cdn.jsdelivr.net/npm/interactjs/dist/interact.min.js"></script>

  <!-- pixel font -->
  <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">

  <style>
  /* ─── variables ─── */
  :root{
    --bg:#f2efe8; --ink:#2b2b2b; --mid:#c2c2c2;
    --light:#faf9f5; --shadow:#7a7a7a; --corner:2px;
    --rainbow:linear-gradient(45deg,#ff0040,#ff8000,#ffff00,#00ff00,#00c0ff,#4000ff,#ff00c0);
  }

  /* ─── layout ─── */
  html{height:100%; zoom:80%;}
  body{
    font-family:'VT323',monospace;
    background:var(--bg) url('./assets/wallpaper.png') repeat fixed;
    color:var(--ink); display:flex; flex-direction:column;
    align-items:center; padding:60px 20px; gap:30px;
    -webkit-user-select: none; /* Safari */
    -ms-user-select: none; /* IE 10+ */
    user-select: none; /* Standard syntax */
    margin: 0;
    min-height: 100vh; /* FIX: Prevents body from being too short */
    box-sizing: border-box;
  }
  h2{margin:0;font-size:32px;letter-spacing:1px;text-shadow:1px 1px var(--light)}

  /* ─── window frame ─── */
  .window{
    background:var(--light);border:2px solid var(--ink);
    box-shadow:0 0 0 1px var(--shadow);display:inline-block;
    flex-shrink: 0; /* FIX: Prevents window from stretching vertically */
  }
  .titlebar{height:24px;background:var(--mid);display:flex;align-items:center;justify-content:space-between;padding:0 6px;border-bottom:2px solid var(--ink);font-size:19px}
  .controls{display:flex;gap:3px}
  .btn-square{width:14px;height:14px;background:var(--light);border:1px solid var(--ink)}

  /* ─── content area ─── */
  .content{padding:20px;text-align:center}
  #wrap{position:relative;display:inline-block;max-width:100%;overflow:hidden; touch-action: none; /* Prevents default touch actions like scrolling/zooming page */}
  #wrap img,#wrap canvas{display:block;max-width:100%;height:auto;image-rendering:pixelated}
  #shot,#layer{position:absolute;top:0;left:0;max-width:100%;height:auto;image-rendering:pixelated;pointer-events:none;z-index:0}
  .hat{position:absolute;cursor:move;touch-action:none;user-select:none;box-sizing:border-box; transform-origin: center; -webkit-touch-callout: none; /* iOS Safari - disables the menu on long press */}
  .hat.selected{border:2px dashed var(--ink)}
  .delete-btn{position:absolute;top:-8px;right:-8px;width:20px;height:20px;background:#ff5555;color:#fff;border:1px solid var(--ink);border-radius:50%;cursor:pointer;display:none;align-items:center;justify-content:center;font:700 16px sans-serif;z-index:10}
  .hat.selected .delete-btn{display:flex}

  /* ─── buttons – base ─── */
  input[type=file],button{
    font-family:inherit;font-size:16px;background:var(--light);
    border:2px solid var(--ink);padding:6px 12px;margin:4px;
    cursor:pointer;display:inline-flex;align-items:center;gap:8px;
    transition:.2s all;
  }
  input[type=file]::file-selector-button{
    font-family:inherit;background:var(--mid);border:none;padding:4px 10px;cursor:pointer;
  }
  button:disabled{opacity:.4;cursor:not-allowed}

  /* ─── icon sizing ─── */
  button svg{width:16px;height:16px;fill:currentColor}

  /* ─── rainbow animation ─── */
  @keyframes rainbowShift{
    0%,100%{background-position:0% 50%}
    50%{background-position:100% 50%}
  }

  @keyframes adhdJitter {
    0%, 100% { transform: translate(0, 0); }
    20% { transform: translate(-2px, 2px); }
    40% { transform: translate(2px, -2px); }
    60% { transform: translate(-1px, -1px); }
    80% { transform: translate(1px, 1px); }
  }

  /* ADHDify (run) */
  #run:hover{
    color:#fff;
    border-color:#fff;
    text-shadow: 1px 1px 3px rgba(0,0,0,0.7); /* ADDED FOR VISIBILITY */
    background: repeating-linear-gradient(
        -45deg,
        #ff0040, #ff0040 12px, #ff8000 12px, #ff8000 24px,
        #ffff00 24px, #ffff00 36px, #00ff00 36px, #00ff00 48px,
        #00c0ff 48px, #00c0ff 60px, #4000ff 60px, #4000ff 72px
    );
    background-size: 250% 250%;
    animation: rainbowShift 5s linear infinite;
    transform: translateY(-2px);
    box-shadow: 0 4px 0 var(--shadow);
  }

  /* ULTRA ADHDify (ultraRun) */
  #ultraRun{
    border-width:3px;font-weight:bold;
  }
  /* Faster, thinner stripes with a jitter animation and glitchy shadow */
  #ultraRun:hover{
    color:#fff;
    border-color: var(--ink);
    background: repeating-linear-gradient(
        -45deg,
        #ff0040, #ff0040 7px, #ff8000 7px, #ff8000 14px,
        #ffff00 14px, #ffff00 21px, #00ff00 21px, #00ff00 28px,
        #00c0ff 28px, #00c0ff 35px, #4000ff 35px, #4000ff 42px
    );
    background-size: 350% 350%;
    animation:
        rainbowShift 2s linear infinite,
        adhdJitter 0.25s linear infinite;
    box-shadow: 3px 3px 0 #ff0040, -3px -3px 0 #00c0ff;
    /* ENHANCED SHADOW FOR MAX VISIBILITY */
    text-shadow: 1px 1px 0 #000, 2px 2px 0 #000;
  }

  /* Add Hat */
  #addHat{background:#55aa55;color:#fff;border-color:#3d7e3d}
  #addHat:hover{background:#69c069;border-color:#55aa55;box-shadow:0 0 8px rgba(0,128,0,.4)}

  /* Delete Selected */
  #deleteHat{background:#cc4444;color:#fff;border-color:#992c2c}
  #deleteHat:hover{background:#e66767;border-color:#cc4444;box-shadow:0 0 8px rgba(200,0,0,.4)}

  /* Download button – keep neutral but clearer intent */
  #download{background:#3d88c8;color:#fff;border-color:#2b5a80}
  #download:hover{background:#4d9ae0;border-color:#3d88c8;box-shadow:0 0 8px rgba(0,64,128,.4)}

  /* status text */
  #status{margin-top:12px;color:var(--shadow);font-size:18px}
  #downloadOptions { margin-top: 10px; display: flex; align-items: center; justify-content: center; gap: 15px; font-size: 16px;}

  /* ─── Thematic Switch ─── */
  .switch { position: relative; display: inline-block; width: 44px; height: 22px; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider {
      position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
      background-color: var(--mid); transition: .3s;
      border: 2px solid var(--ink);
  }
  .slider:before {
      position: absolute; content: ""; height: 12px; width: 12px; left: 3px; bottom: 3px;
      background-color: var(--light); border: 1px solid var(--ink);
      transition: .3s;
  }
  input:checked + .slider { background-color: #55aa55; }
  input:checked + .slider:before { transform: translateX(20px); }

  /* --- Responsive Design for Tablets --- */
  @media (max-width: 1024px) {
    html {
      zoom: 1; /* Adjust zoom for better fit */
    }
    body {
      padding: 40px 15px; /* Adjust padding */
      gap: 25px;
    }
    h2 {
      font-size: 28px; /* Slightly smaller title */
    }
    .window {
      width: 95%; /* Use more of the screen width */
      max-width: 912px; /* Set a reasonable max width */
    }
    .content {
      padding: 18px; /* Adjust content padding */
    }
    /* Adjust button font size for better fit */
    .content button, .content input[type=file] {
      font-size: 25px;
    }
    #status {
      font-size: 16px;
    }
  }

  /* --- Responsive Design for Mobile --- */
  @media (max-width: 768px) {
    html {
      zoom: normal; /* remove the fixed zoom on mobile */
    }

    body {
      padding: 20px 10px; /* reduce padding on smaller screens */
      gap: 20px;
    }

    h2 {
      font-size: 24px; /* slightly smaller title */
      text-align: center;
    }

    .window {
      width: 100%; /* allow the window to take the full width */
      max-width: 600px; /* but not get too wide on tablets */
      box-sizing: border-box;
    }

    .content {
      padding: 15px; /* reduce content padding */
    }
      
    /* make the button bar wrap nicely */
    .button-grid { display: flex; flex-wrap: wrap; justify-content: center; }
    .content button, .content input[type=file] {
      flex-grow: 1; /* allow buttons to grow and fill space */
      font-size: 15px; /* smaller font for more compact buttons */
      padding-top: 10px; /* Increase tap area */
      padding-bottom: 10px; /* Increase tap area */
    }
      
    #wrap {
      /* ensure the image container doesn't overflow its parent */
      max-width: 100%; 
      height: auto; /* ensure height scales correctly */
    }
    
    /* FIX: Make status font smaller on mobile */
    #status {
        font-size: 14px;
        margin-top: 8px;
    }
  }
  </style>
</head>
<body>

  <h2>Magic ADHD filters · Moveable ADHD Brains · Goofy Eyes</h2>

  <!-- main app window -->
  <div class="window">
    <div class="titlebar">
      <span>ADHD Filter Suite v2.1</span>
      <div class="controls">
        <div class="btn-square"></div>
        <div class="btn-square"></div>
      </div>
    </div>

    <div class="content">
      <div class="button-grid">
        <input type="file" id="pick" accept="image/*">
        <button id="run" disabled>
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" shape-rendering="crispEdges"><path d="M4 20L16 8l2 2L6 22l-2-2z M17 2h2v4h4v2h-4v4h-2V8h-4V6h4V2z" fill="currentColor"/></svg>
          ADHDify
        </button>
         <button id="ultraRun" disabled>
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" shape-rendering="crispEdges"><path d="M7 0L0 9h6v7l7-9H7V0z"/></svg>
          ULTRA ADHDify
        </button>
        <button id="addHat" disabled>
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" shape-rendering="crispEdges"><path d="M7 0h2v7h7v2h-7v7h-2v-7h-7v-2h7v-7z"/></svg>
          Add Prop
        </button>
        <button id="deleteHat" disabled>
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" shape-rendering="crispEdges"><path d="M2 5v11h12V5H2zm3 1h2v8H5V6zm4 0h2v8H9V6zM1 2h14v2H1V2z"/></svg>
          Delete Selected
        </button>
        <button id="download" disabled>
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" shape-rendering="crispEdges"><path d="M14 9h-3v-8h-4v8h-3l5 6 5-6zm-13 7h14v-2h-14v2z"/></svg>
          Download PNG
        </button>
      </div>
      <div id="downloadOptions">
        <label for="includeOffCanvas">Include off-screen props</label>
        <label class="switch">
          <input type="checkbox" id="includeOffCanvas">
          <span class="slider"></span>
        </label>
      </div>
      <p id="status">loading models…</p>
      <div id="wrap">
        <img id="shot" hidden>
        <canvas id="layer" hidden></canvas>
      </div>
    </div>
  </div>

    <script>
  const MODEL_URL='./model/';
  const pick=document.getElementById('pick');
  const runBtn=document.getElementById('run');
  const ultraRunBtn=document.getElementById('ultraRun');
  const addBtn=document.getElementById('addHat');
  const deleteBtn=document.getElementById('deleteHat');
  const dlBtn=document.getElementById('download');
  const img=document.getElementById('shot');
  const layer=document.getElementById('layer');
  const info=document.getElementById('status');
  const wrap=document.getElementById('wrap');
  const includeOffCanvasCheck = document.getElementById('includeOffCanvas');


  const hatSrc='./assets/hat.png';
  const hatBase=new Image(); hatBase.src=hatSrc;

  const hats=[];
  let selectedHat = null;
  const OVERHANG=.75;
  let coordinateScale = 1;

  // --- INITIALIZATION ---
  (async()=>{
    await Promise.all([
      faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL),
      faceapi.nets.faceLandmark68TinyNet.loadFromUri(MODEL_URL)
    ]);
    updateUIState();
  })();

  function updateScaleAndHatPositions() {
      if (img.hidden || !img.naturalWidth) return;
      coordinateScale = img.naturalWidth / wrap.clientWidth;
      hats.forEach(h => {
          const data = h.dataset;
          h.style.left = `${parseFloat(data.x) / coordinateScale}px`;
          h.style.top = `${parseFloat(data.y) / coordinateScale}px`;
          h.style.width = `${parseFloat(data.w) / coordinateScale}px`;
          h.style.height = `${parseFloat(data.h) / coordinateScale}px`;
      });
  }

  function clearHats() {
    hats.forEach(h=>h.remove());
    hats.length=0;
    selectHat(null);
  }

  function clearOverlays() {
      clearHats();
      const ctx = layer.getContext('2d');
      ctx.clearRect(0, 0, layer.width, layer.height);
      layer.hidden = true;
      img.hidden = false;
  }

  function updateUIState() {
      const hasImage = !img.hidden || !layer.hidden;
      const hasDistortion = !layer.hidden;
      const hasHats = hats.length > 0;
      runBtn.disabled = !hasImage;
      ultraRunBtn.disabled = !hasImage;
      addBtn.disabled = !hasImage;
      deleteBtn.disabled = !selectedHat;
      dlBtn.disabled = !hasImage || (!hasHats && !hasDistortion);
      info.style.color = '';
      if (selectedHat) {
          info.textContent = 'Drag, pinch, or rotate anywhere on the image. Use handles to resize.';
      } else if (hasHats || hasDistortion) {
          let parts = [];
          if (hasHats) parts.push(`${hats.length} prop(s) placed`);
          if (hasDistortion) parts.push('eyes distorted');
          info.textContent = parts.join(' and ') + '. Click a prop to select it.';
      } else if (hasImage) {
          info.textContent = 'Image loaded. Click a button to begin.';
      } else {
          info.textContent = 'models ready — choose an image';
      }
  }

  function selectHat(hatElement) {
      if (selectedHat) {
          selectedHat.classList.remove('selected');
      }
      selectedHat = hatElement;
      if (selectedHat) {
          selectedHat.classList.add('selected');
      }
      interact(wrap).draggable(!!selectedHat);
      interact(wrap).gesturable(!!selectedHat);
      updateUIState();
  }

  const MAX_DIMENSION = 1920;

  // --- EVENT LISTENERS ---
  pick.addEventListener('change', () => {
      const f = pick.files[0];
      if (!f) return;
      const r = new FileReader();
      r.onload = e => {
          clearOverlays();
          img.src = e.target.result; 
          img.hidden = false;
          layer.hidden = true;
          info.style.color = '';
          info.textContent = 'Loading image...';
      };
      r.readAsDataURL(f);
  });

  img.addEventListener('load', () => {
      let w = img.naturalWidth;
      let h = img.naturalHeight;
      if (w > MAX_DIMENSION || h > MAX_DIMENSION) {
          info.textContent = `Resizing image to fit ${MAX_DIMENSION}px...`;
          const ratio = w / h;
          if (w > h) { w = MAX_DIMENSION; h = Math.round(w / ratio); } 
          else { h = MAX_DIMENSION; w = Math.round(h * ratio); }
          const canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = h;
          canvas.getContext('2d').drawImage(img, 0, 0, w, h);
          img.src = canvas.toDataURL('image/jpeg', 0.92);
          return; 
      }
      
      wrap.style.width = img.naturalWidth + 'px';
      wrap.style.height = img.naturalHeight + 'px';

      layer.width = img.naturalWidth;
      layer.height = img.naturalHeight;
      updateUIState();
      updateScaleAndHatPositions();
  });

  window.addEventListener('resize', updateScaleAndHatPositions);

  wrap.addEventListener('click', (e) => {
      if (e.target === wrap || e.target === img || e.target === layer) {
          selectHat(null);
      }
  });

  runBtn.addEventListener('click',async()=>{
    runBtn.disabled=true; ultraRunBtn.disabled=true;
    info.style.color = ''; info.textContent='detecting…';
    await Promise.all([img.decode(),hatBase.decode()]);
    let dets = await faceapi.detectAllFaces(img, new faceapi.TinyFaceDetectorOptions({ scoreThreshold: .45 }));
    if (!dets.length) {
      info.textContent = 'detecting (tier 2)…';
      dets = await faceapi.detectAllFaces(img, new faceapi.TinyFaceDetectorOptions({ scoreThreshold: .25 }));
    }
    if (!dets.length) {
      info.textContent = 'detecting (tier 3)…';
      const loose = await faceapi.detectAllFaces(img, new faceapi.TinyFaceDetectorOptions({ scoreThreshold: .1 }));
      if (loose.length) { loose.sort((a,b) => b.score - a.score); dets = [loose[0]]; }
    }
    clearOverlays();
    if(!dets.length){
      info.style.color = '#cc4444'; info.textContent = 'Could not find a face. Please try a clearer image!';
      runBtn.disabled = ultraRunBtn.disabled = !img.hidden;
      return;
    }
    dets.forEach(({box})=>addHat({box}));
    selectHat(hats[hats.length-1]);
    updateUIState();
  });

  ultraRunBtn.addEventListener('click', async () => {
    runBtn.disabled = ultraRunBtn.disabled = true;
    info.style.color = ''; info.textContent = 'ULTRA detecting…';
    await Promise.all([img.decode(), hatBase.decode()]);
    let dets = await faceapi.detectAllFaces(img, new faceapi.TinyFaceDetectorOptions({ scoreThreshold: .4 })).withFaceLandmarks(true);
    if (!dets.length) {
      info.textContent = 'ULTRA detecting (tier 2)…';
      dets = await faceapi.detectAllFaces(img, new faceapi.TinyFaceDetectorOptions({ scoreThreshold: .2 })).withFaceLandmarks(true);
    }
    if (!dets.length) {
      info.textContent = 'ULTRA detecting (tier 3)…';
      const loose = await faceapi.detectAllFaces(img, new faceapi.TinyFaceDetectorOptions({ scoreThreshold: .1 })).withFaceLandmarks(true);
      if (loose.length) { loose.sort((a, b) => b.detection.score - a.detection.score); dets = [loose[0]]; }
    }
    clearOverlays();
    if (!dets.length) {
      info.style.color = '#cc4444'; info.textContent = 'Could not find a face for ULTRA mode. Try a clearer image!';
      runBtn.disabled = ultraRunBtn.disabled = !img.hidden; return;
    }
    dets.forEach(det => addHat({ box: det.detection.box }));
    distortEyes(dets);
    selectHat(hats[hats.length - 1] || null);
    updateUIState();
  });

  addBtn.addEventListener('click', () => { addHat({}); selectHat(hats[hats.length-1]); updateUIState(); });

  deleteBtn.addEventListener('click', () => {
      if (!selectedHat) return;
      const index = hats.indexOf(selectedHat);
      if(index > -1) { hats.splice(index, 1); }
      selectedHat.remove(); selectHat(null); updateUIState();
  });

  dlBtn.addEventListener('click', () => {
    const hasDistortion = !layer.hidden;
    const hasHats = hats.length > 0;
    if (!hasHats && !hasDistortion) return;

    const baseImage = hasDistortion ? layer : img;
    const out = document.createElement('canvas');
    const ctx = out.getContext('2d');
    
    if (includeOffCanvasCheck.checked && hasHats) {
        let minX = 0, minY = 0, maxX = img.naturalWidth, maxY = img.naturalHeight;

        hats.forEach(h => {
            const data = Object.fromEntries(Object.entries(h.dataset).map(([k, v]) => [k, parseFloat(v)]));
            const rad = data.rot * Math.PI / 180, cos = Math.cos(rad), sin = Math.sin(rad);
            const w_scaled = data.w * data.scale / 2, h_scaled = data.h * data.scale / 2;
            const cx = data.x + data.w / 2, cy = data.y + data.h / 2;
            const corners = [ { x: -w_scaled, y: -h_scaled }, { x: w_scaled, y: -h_scaled }, { x: w_scaled, y: h_scaled }, { x: -w_scaled, y: h_scaled } ];
            corners.forEach(corner => {
                const rotX = corner.x * cos - corner.y * sin + cx, rotY = corner.x * sin + corner.y * cos + cy;
                minX = Math.min(minX, rotX); minY = Math.min(minY, rotY);
                maxX = Math.max(maxX, rotX); maxY = Math.max(maxY, rotY);
            });
        });

        minX = Math.min(minX, 0); minY = Math.min(minY, 0);
        maxX = Math.max(maxX, img.naturalWidth); maxY = Math.max(maxY, img.naturalHeight);

        const contentW = maxX - minX, contentH = maxY - minY;
        
        const BASE_WIDTH = 1000;
        const scaleFactor = 2;//Math.max(1, Math.sqrt(contentW / BASE_WIDTH));

        const PADDING = Math.round(20);
        const BORDER = Math.round(2 * scaleFactor);
        const SHADOW = Math.ceil(1 * scaleFactor);
        const TITLEBAR_H = Math.round(24 * scaleFactor);

        const frameW = PADDING * 2 + BORDER * 2 + SHADOW;
        const frameH = PADDING * 2 + BORDER * 2 + SHADOW + TITLEBAR_H;

        out.width = contentW + frameW; out.height = contentH + frameH;
        
        const offsetX = -minX + PADDING + BORDER;
        const offsetY = -minY + PADDING + BORDER + TITLEBAR_H + BORDER;
        
        ctx.fillStyle = '#7a7a7a';
        ctx.fillRect(SHADOW, SHADOW, out.width - SHADOW, out.height - SHADOW);
        ctx.fillStyle = '#2b2b2b';
        ctx.fillRect(0, 0, out.width, out.height);
        ctx.fillStyle = '#faf9f5';
        ctx.fillRect(BORDER, BORDER, out.width - BORDER * 2, out.height - BORDER * 2);
        ctx.fillStyle = '#c2c2c2';
        ctx.fillRect(BORDER, BORDER, out.width - BORDER * 2, TITLEBAR_H);
        ctx.fillStyle = '#2b2b2b';
        ctx.fillRect(BORDER, BORDER + TITLEBAR_H, out.width - BORDER * 2, BORDER);
        
        const titleFontSize = Math.round(19 * scaleFactor);
        ctx.font = `${titleFontSize}px "VT323", monospace`; ctx.fillStyle = '#2b2b2b'; ctx.textBaseline = 'middle';
        ctx.fillText('ADHD on Solana', BORDER + Math.round(6 * scaleFactor), BORDER + TITLEBAR_H / 2 + 1);

        const btnSize = Math.round(14 * scaleFactor);
        const btnMargin = Math.round(6 * scaleFactor);
        const btnSpacing = Math.round(3 * scaleFactor);
        const btnY = BORDER + (TITLEBAR_H - btnSize) / 2;
        const redBtnX = out.width - BORDER - btnMargin - btnSize;
        const greenBtnX = redBtnX - btnSpacing - btnSize;

        ctx.strokeStyle = '#2b2b2b';
        ctx.lineWidth = Math.ceil(1 * scaleFactor);
        const lineOffset = ctx.lineWidth / 2;

        ctx.fillStyle = '#55aa55';
        ctx.fillRect(greenBtnX, btnY, btnSize, btnSize);
        ctx.strokeRect(greenBtnX - lineOffset, btnY - lineOffset, btnSize + (lineOffset*2), btnSize + (lineOffset*2));
        ctx.fillStyle = '#fff';
        ctx.fillRect(
          greenBtnX + Math.round(3 * scaleFactor), 
          btnY + btnSize - Math.round(5 * scaleFactor), // <-- FIX IS HERE
          btnSize - Math.round(6 * scaleFactor), 
          Math.max(1, Math.round(2 * scaleFactor))
        );

        ctx.fillStyle = '#cc4444';
        ctx.fillRect(redBtnX, btnY, btnSize, btnSize);
        ctx.strokeRect(redBtnX - lineOffset, btnY - lineOffset, btnSize + (lineOffset*2), btnSize + (lineOffset*2));
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = Math.max(1, Math.round(2 * scaleFactor));
        const xPad = Math.round(3 * scaleFactor);
        ctx.beginPath();
        ctx.moveTo(redBtnX + xPad, btnY + xPad);
        ctx.lineTo(redBtnX + btnSize - xPad, btnY + btnSize - xPad);
        ctx.moveTo(redBtnX + btnSize - xPad, btnY + xPad);
        ctx.lineTo(redBtnX + xPad, btnY + btnSize - xPad);
        ctx.stroke();

        ctx.drawImage(baseImage, offsetX, offsetY);
        hats.forEach(h => {
            const { x, y, w, h: ht, rot, scale } = Object.fromEntries(Object.entries(h.dataset).map(([k, v]) => [k, parseFloat(v)]));
            ctx.save();
            ctx.translate(x + w / 2 + offsetX, y + ht / 2 + offsetY);
            ctx.rotate(rot * Math.PI / 180); ctx.scale(scale, scale);
            ctx.drawImage(hatBase, -w / 2, -ht / 2, w, ht);
            ctx.restore();
        });

    } else {
        out.width = img.naturalWidth; out.height = img.naturalHeight;
        ctx.drawImage(baseImage, 0, 0);
        hats.forEach(h => {
            const { x, y, w, h: ht, rot, scale } = Object.fromEntries(Object.entries(h.dataset).map(([k, v]) => [k, parseFloat(v)]));
            ctx.save();
            ctx.translate(x + w / 2, y + ht / 2);
            ctx.rotate(rot * Math.PI / 180); ctx.scale(scale, scale);
            ctx.drawImage(hatBase, -w / 2, -ht / 2, w, ht);
            ctx.restore();
        });
    }

    const link = document.createElement('a');
    link.href = out.toDataURL('image/png');
    link.download = 'adhdified-creation.png';
    link.click();
  });

  function clampPos({x,y,w,h}){
    const maxX=img.naturalWidth-w*(1-OVERHANG); const minX=-w*OVERHANG;
    const maxY=img.naturalHeight-h*(1-OVERHANG); const minY=-h*OVERHANG;
    return{ x:Math.min(Math.max(x,minX),maxX), y:Math.min(Math.max(y,minY),maxY) };
  }

  function addHat({box}){
    const h=document.createElement('img');
    h.src=hatSrc; h.className='hat';
    h.ondragstart = () => false;

    let trueW, trueH, trueX, trueY;
    if (box) {
      trueW = box.width*1.25;
      trueH = hatBase.naturalHeight/hatBase.naturalWidth * trueW * 1.25;
      trueX = box.x+box.width/2 - trueW/2;
      trueY = box.y-trueH*.95;
    } else {
      trueW = img.naturalWidth / 4;
      trueH = hatBase.naturalHeight / hatBase.naturalWidth * trueW;
      trueX = (img.naturalWidth / 2) - (trueW / 2);
      trueY = (img.naturalHeight / 2) - (trueH / 2);
    }
    ({x: trueX, y: trueY} = clampPos({x: trueX, y: trueY, w: trueW, h: trueH}));
    Object.assign(h.dataset, {x: trueX, y: trueY, w: trueW, h: trueH, rot: 0, scale: 1});
    Object.assign(h.style,{
        width: `${trueW / coordinateScale}px`, height: `${trueH / coordinateScale}px`,
        left: `${trueX / coordinateScale}px`, top: `${trueY / coordinateScale}px`,
        transform:'rotate(0deg) scale(1)'
    });

    h.addEventListener('click', (e) => { e.stopPropagation(); selectHat(h); });
    h.addEventListener('wheel',e=>{
      if (selectedHat !== h) return;
      e.preventDefault();
      const ang=(+h.dataset.rot)+e.deltaY*.05;
      h.dataset.rot=ang;
      h.style.transform=`rotate(${ang}deg) scale(${+h.dataset.scale})`;
    });

    const delBtn = document.createElement('div');
    delBtn.className = 'delete-btn'; delBtn.innerHTML = '×';
    delBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      const index = hats.indexOf(h);
      if(index > -1) hats.splice(index, 1);
      h.remove(); selectHat(null); updateUIState();
    });
    h.appendChild(delBtn);
    wrap.appendChild(h); hats.push(h);

    interact(h)
      .resizable({
          edges:{left:true,right:true,top:true,bottom:true},
          listeners: {
              move(ev) {
                  const newTrueWidth = ev.rect.width * coordinateScale;
                  const newTrueHeight = ev.rect.height * coordinateScale;
                  let x = parseFloat(h.dataset.x) + (ev.deltaRect.left * coordinateScale);
                  let y = parseFloat(h.dataset.y) + (ev.deltaRect.top * coordinateScale);
                  ({x,y} = clampPos({x,y,w:newTrueWidth,h:newTrueHeight}));
                  Object.assign(h.dataset,{x, y, w:newTrueWidth, h:newTrueHeight});
                  Object.assign(h.style, {
                      left: `${x / coordinateScale}px`, top: `${y / coordinateScale}px`,
                      width: `${newTrueWidth / coordinateScale}px`, height: `${newTrueHeight / coordinateScale}px`
                  });
              }
          },
          modifiers: [ interact.modifiers.aspectRatio({ ratio: 'preserve', equalDelta: true }) ],
      })
      .on('tap', () => { selectHat(h); });
  }

  // --- GLOBAL (WRAP) INTERACTION LISTENERS ---
  interact(wrap)
    .draggable({
      enabled: false,
      listeners: {
        move(ev) {
          if (!selectedHat) return;
          const h = selectedHat;
          let x = parseFloat(h.dataset.x) + (ev.dx * coordinateScale);
          let y = parseFloat(h.dataset.y) + (ev.dy * coordinateScale);
          ({x,y} = clampPos({x, y, w: +h.dataset.w, h: +h.dataset.h}));
          Object.assign(h.dataset,{x,y});
          h.style.left = `${x / coordinateScale}px`;
          h.style.top = `${y / coordinateScale}px`;
        }
      }
    })
    .gesturable({
      enabled: false,
      listeners: {
        move (ev) {
          if (!selectedHat) return;
          const h = selectedHat;
          let angle = parseFloat(h.dataset.rot) + ev.da;
          let scale = parseFloat(h.dataset.scale) * (1 + ev.ds);
          h.style.transform = `rotate(${angle}deg) scale(${scale})`;
          Object.assign(h.dataset, {rot: angle, scale: scale});
        }
      }
    });

  // --- distortEyes function (unchanged) ---
  function distortEyes(detections) {
      const ctx = layer.getContext('2d');
      ctx.drawImage(img, 0, 0, layer.width, layer.height);
      const originalImageData = ctx.getImageData(0, 0, layer.width, layer.height);
      const distortedImageData = ctx.createImageData(layer.width, layer.height);
      const origData = originalImageData.data;
      const newData = distortedImageData.data;
      const strength = 0.65; const effectScale = 3.0;
      const getInterpolatedPixel = (x, y) => {
          const x_floor = Math.floor(x), y_floor = Math.floor(y);
          const x_frac = x - x_floor, y_frac = y - y_floor;
          const p00_idx = (y_floor * layer.width + x_floor) * 4;
          const p10_idx = (y_floor * layer.width + (x_floor + 1)) * 4;
          const p01_idx = ((y_floor + 1) * layer.width + x_floor) * 4;
          const p11_idx = ((y_floor + 1) * layer.width + (x_floor + 1)) * 4;
          const blendedPixel = [0, 0, 0, 255];
          for (let i = 0; i < 3; i++) {
              const top = origData[p00_idx + i] * (1 - x_frac) + origData[p10_idx + i] * x_frac;
              const bottom = origData[p01_idx + i] * (1 - x_frac) + origData[p11_idx + i] * x_frac;
              blendedPixel[i] = top * (1 - y_frac) + bottom * y_frac;
          }
          return blendedPixel;
      };
      newData.set(origData);
      detections.forEach(det => {
          const landmarks = det.landmarks;
          const eyeRegions = [landmarks.getLeftEye(), landmarks.getRightEye()];
          eyeRegions.forEach(eyePoints => {
              const xs = eyePoints.map(p => p.x), ys = eyePoints.map(p => p.y);
              const eyeWidth = Math.max(...xs) - Math.min(...xs);
              const cx = Math.min(...xs) + eyeWidth / 2;
              const cy = Math.min(...ys) + (Math.max(...ys) - Math.min(...ys)) / 2;
              const radius = (eyeWidth / 2) * effectScale;
              if (radius === 0) return;
              for (let y = Math.floor(cy - radius); y < Math.ceil(cy + radius); y++) {
                  for (let x = Math.floor(cx - radius); x < Math.ceil(cx + radius); x++) {
                      if (x < 0 || x >= layer.width || y < 0 || y >= layer.height) continue;
                      const dx = x - cx, dy = y - cy;
                      const distance = Math.sqrt(dx * dx + dy * dy);
                      if (distance < radius) {
                          const normalizedDist = distance / radius;
                          const r = normalizedDist * (1.0 - strength * (1.0 - normalizedDist));
                          const angle = Math.atan2(dy, dx);
                          const sourceX = cx + r * radius * Math.cos(angle);
                          const sourceY = cy + r * radius * Math.sin(angle);
                          if (sourceX >= 0 && sourceX < layer.width - 1 && sourceY >= 0 && sourceY < layer.height - 1) {
                              const pixel = getInterpolatedPixel(sourceX, sourceY);
                              const destIndex = (y * layer.width + x) * 4;
                              newData[destIndex] = pixel[0]; newData[destIndex + 1] = pixel[1]; newData[destIndex + 2] = pixel[2];
                          }
                      }
                  }
              }
          });
      });
      ctx.putImageData(distortedImageData, 0, 0);
      img.hidden = true; layer.hidden = false;
  }
  </script>
